name: 测试与发布守门

on:
  push:
  pull_request:

jobs:
  posix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: 运行单元测试
        run: python3 -m unittest discover -s tests -v
      - name: 执行公开发布守门
        run: python3 tools/release_guard.py --root . --mode public

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v
      - name: 执行公开发布守门
        run: python tools/release_guard.py --root . --mode public
